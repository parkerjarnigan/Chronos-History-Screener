name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # cache: 'npm'
          # cache-dependency-path: ./Chronos-History-Screener/package-lock.json

      # Explicitly entering the folder just for the install step
      - name: Install dependencies
        run: |
          cd Chronos-History-Screener
          npm install

      # Explicitly entering the folder just for the build step
      - name: Build application
        run: |
          cd Chronos-History-Screener
          npm run build

      # Setup Pages infrastructure
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Target the specific built output directory precisely 
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './Chronos-History-Screener/dist'

      # Deploy everything live
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
